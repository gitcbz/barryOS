name: build

# Builds the kernel and every bootable artifact on each push, attaches them to
# the run, and publishes them as releases:
#
#   push to main   -> updates a rolling "latest" release
#   tag v*         -> creates a versioned release
#
# No QEMU here.  The runner builds and publishes; booting is verified on a real
# hypervisor, where the firmware is the one people actually use.  Structural
# checks on the artifacts still run, because a mis-shaped file should not reach
# a release.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            nasm xorriso mtools dosfstools qemu-utils \
            clang lld binutils-mingw-w64-x86-64 gcc-mingw-w64-x86-64 \
            python3 file xxd
          # The trust store generator parses certificates, so it needs
          # `cryptography`; nothing else in the build uses Python packages.
          python3 -m pip install --user --break-system-packages cryptography
          nasm -v
          xorriso --version | head -1
          qemu-img --version | head -1
          clang --version | head -1
          x86_64-w64-mingw32-ld --version | head -1
          x86_64-w64-mingw32-gcc --version | head -1
          python3 -c "import cryptography; print(cryptography.__version__)"

      - name: Install Rust nightly
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain nightly --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Add the no_std target and rust-src
        # rust-src is not optional: kernel/.cargo/config.toml sets build-std, so
        # core and compiler_builtins are compiled alongside the kernel.
        run: |
          rustup target add x86_64-unknown-none
          rustup component add rust-src
          rustc --version

      - name: Build kernel, images, ISO and VMDKs
        run: make all vmdk

      - name: Inspect the artifacts
        # Cheap structural checks, so a build that produced a file of the wrong
        # shape fails here rather than being published.
        run: |
          ls -la build/
          echo "--- MBR magic ---"
          test "$(od -An -tx1 -j510 -N2 build/mbr.bin | tr -d ' \n')" = "55aa"
          echo "--- kernel ELF ---"
          readelf -h build/kernel.elf | grep -i 'Machine:.*X86-64'
          echo "--- flat kernel within the loader's ceiling ---"
          test "$(stat -c%s build/kernel.bin)" -le 8388608
          echo "--- EFI application ---"
          file build/BOOTX64.EFI
          file build/BOOTX64.EFI | grep -qiE 'PE32\+|EFI'
          echo "--- VMDK ---"
          file build/barryOS-bios.vmdk build/barryOS-uefi.vmdk

      - name: Upload the run's artifacts
        uses: actions/upload-artifact@v4
        with:
          name: barryOS-images
          path: |
            build/barryOS.iso
            build/barryOS-bios.img
            build/barryOS-uefi.img
            build/barryOS-bios.vmdk
            build/barryOS-uefi.vmdk
          retention-days: 30

      - name: Publish the rolling "latest" release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest \
              --title "barryOS (latest)" \
              --notes "Rolling build of \`main\`. Updated on every push."
          fi
          gh release upload latest \
            build/barryOS.iso \
            build/barryOS-bios.img \
            build/barryOS-uefi.img \
            build/barryOS-bios.vmdk \
            build/barryOS-uefi.vmdk \
            --clobber

      - name: Publish a versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "barryOS ${GITHUB_REF_NAME}" \
            --generate-notes \
            build/barryOS.iso \
            build/barryOS-bios.img \
            build/barryOS-uefi.img \
            build/barryOS-bios.vmdk \
            build/barryOS-uefi.vmdk
